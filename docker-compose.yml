# Local backend storage: persistent Postgres plus Redis for sequence counters,
# realtime pub/sub, and long polling. Non-default ports avoid local conflicts.
# NOTE: DB/Redis ports are bound to 127.0.0.1 only — the app reaches them over the
# compose network, so there is no reason to expose them on all interfaces.
services:
  postgres:
    image: postgres:16.3-alpine
    container_name: workora-pg
    environment:
      # Keep in sync with DATABASE_URL in .env.docker. These credentials only
      # initialize a FRESH volume; an existing volume keeps its own roles.
      POSTGRES_USER: opentag
      POSTGRES_PASSWORD: opentag
      POSTGRES_DB: opentag
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentag -d opentag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: workora-redis
    # Default: no auth (suitable for a private network / single-host VPS behind a firewall).
    # To enable Redis password auth, replace the default `image` line above with:
    #   command: redis-server --requirepass ${REDIS_PASSWORD}
    # then set REDIS_PASSWORD in .env.docker and update REDIS_URL to:
    #   redis://:${REDIS_PASSWORD}@redis:6379
    # See docs/self-host.md "Redis password hardening" for the full procedure.
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Control plane (API + web). Opt-in via `--profile app` so `npm run infra` (no profile) still brings up
  # only postgres+redis for host-run development. The daemon is NOT here — run it on your host (see docs/docker.md).
  app:
    build: { context: ., dockerfile: Dockerfile }
    image: workora-app:latest
    container_name: workora-app
    profiles: ["app"]
    # Env comes from the compose `.env` file (Dokploy writes UI env vars there), interpolated
    # below. Secrets are REQUIRED — the server refuses to start without JWT_SECRET and
    # DAEMON_BOOTSTRAP_KEY. Defaults match the compose services for a zero-config local start.
    environment:
      PORT: ${APP_PORT:-7788}
      DATABASE_URL: ${DATABASE_URL:-postgres://opentag:opentag@postgres:5432/opentag}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DAEMON_BOOTSTRAP_KEY: ${DAEMON_BOOTSTRAP_KEY:?set DAEMON_BOOTSTRAP_KEY in .env}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
    ports: ["${APP_PORT:-7788}:7788"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
